<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Security Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#050403;
    --ember:#ff4d00;
    --flame:#ffb000;
    --core:#fff3b0;
    --blood:#b3120a;
    --paper:#f4ede4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--paper);
    font-family:"Space Grotesk",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}

  /* ---------- background ---------- */
  #embers{position:fixed;inset:0;width:100%;height:100%;z-index:0}
  .heat{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 80% 45% at 50% 108%, rgba(255,77,0,.55), transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% -10%, rgba(179,18,10,.35), transparent 70%);
    animation:heat 2.4s ease-in-out infinite alternate}
  @keyframes heat{from{opacity:.65}to{opacity:1}}
  .scan{position:fixed;inset:0;z-index:30;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply}
  .vignette{position:fixed;inset:0;z-index:29;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75))}

  /* ---------- gate (fake security check) ---------- */
  #gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0b0b0d;padding:24px;
    transition:opacity .25s}
  #gate.gone{opacity:0;pointer-events:none}
  .card{width:min(440px,100%);border:1px solid #2c2c33;background:#131318;padding:28px;border-radius:6px}
  .card .row{display:flex;gap:14px;align-items:center;margin-bottom:18px}
  .card svg{width:40px;height:40px;flex:none;color:#4f8cff}
  .card h1{font-size:20px;font-weight:700;line-height:1.2}
  .card p{font-size:14px;line-height:1.5;color:#9a9aa6;margin-bottom:22px}
  .check{display:flex;align-items:center;gap:12px;border:1px solid #2c2c33;background:#0d0d11;padding:14px;margin-bottom:20px;border-radius:4px;cursor:pointer}
  .box{width:22px;height:22px;border:2px solid #5a5a66;border-radius:3px;display:grid;place-items:center;flex:none}
  .box svg{width:14px;height:14px;color:#4f8cff;opacity:0;width:14px;height:14px}
  .check.on .box{border-color:#4f8cff}
  .check.on .box svg{opacity:1}
  .check span{font-size:15px}
  .btn{width:100%;padding:14px;border:0;border-radius:4px;background:#2f6bff;color:#fff;font:700 15px "Space Grotesk",sans-serif;cursor:pointer}
  .btn:disabled{background:#262a38;color:#6c7080;cursor:default}

  /* ---------- the edit ---------- */
  #stage{position:fixed;inset:0;z-index:5;visibility:hidden}
  #stage.live{visibility:visible}
  #stage.live.hit{animation:hit .5s steps(2) 1}
  @keyframes hit{0%{filter:invert(1) contrast(2)}50%{filter:none}100%{filter:invert(1)}}
  #stage.live.hit{animation:hit .35s steps(1) 1}

  .center{position:absolute;left:50%;top:50%;width:min(62vw,520px);transform:translate(-50%,-50%);z-index:2;
    box-shadow:0 0 0 3px var(--ember),0 0 60px 8px rgba(255,77,0,.55),0 0 140px 30px rgba(179,18,10,.4);
    animation:pulse 1.1s ease-in-out infinite alternate;background:#000}
  .center video{display:block;width:100%;height:auto;max-height:78vh;object-fit:cover}
  @keyframes pulse{
    from{box-shadow:0 0 0 3px var(--ember),0 0 40px 4px rgba(255,77,0,.45),0 0 100px 20px rgba(179,18,10,.3)}
    to{box-shadow:0 0 0 3px var(--flame),0 0 80px 14px rgba(255,120,0,.7),0 0 170px 40px rgba(179,18,10,.5)}}

  .pic{position:absolute;left:0;top:0;width:var(--s);aspect-ratio:3/4;z-index:3;will-change:transform}
  .pic img{position:relative;z-index:2;display:block;width:100%;height:100%;object-fit:cover;
    border:2px solid var(--flame);filter:saturate(1.25) contrast(1.1);pointer-events:none}
  /* fire behind the picture */
  .fire{position:absolute;inset:-26%;z-index:1;pointer-events:none;mix-blend-mode:screen;filter:url(#flame) blur(3px);
    background:
      radial-gradient(ellipse 55% 45% at 50% 96%, var(--core) 0, var(--flame) 28%, var(--ember) 52%, transparent 74%),
      radial-gradient(ellipse 30% 60% at 4% 70%, var(--ember), transparent 72%),
      radial-gradient(ellipse 30% 60% at 96% 70%, var(--ember), transparent 72%),
      radial-gradient(ellipse 60% 32% at 50% 6%, var(--flame), transparent 75%);
    animation:flick .18s steps(2) infinite alternate}
  /* fire licking over the lower part of the picture */
  .lick{position:absolute;left:-6%;right:-6%;bottom:-8%;height:62%;z-index:3;pointer-events:none;mix-blend-mode:screen;
    filter:url(#flame2) blur(2px);
    background:radial-gradient(ellipse 60% 70% at 50% 100%, var(--core) 0, var(--flame) 30%, var(--ember) 55%, transparent 78%);
    -webkit-mask-image:linear-gradient(to top,#000 20%,transparent);mask-image:linear-gradient(to top,#000 20%,transparent);
    animation:flick .22s steps(2) infinite alternate-reverse}
  @keyframes flick{from{opacity:.82;transform:scale(1)}to{opacity:1;transform:scale(1.05)}}

  /* ---------- hud ---------- */
  .hud{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;
    padding:max(14px,env(safe-area-inset-top)) 16px 10px;pointer-events:none;opacity:0;transition:opacity .4s .3s}
  body.on .hud{opacity:1}
  .tag{display:flex;align-items:center;gap:8px;font:700 13px "Space Grotesk",sans-serif;letter-spacing:.04em;
    background:rgba(5,4,3,.72);border:1px solid var(--blood);padding:7px 11px;color:var(--paper)}
  .tag svg{width:18px;height:18px;color:var(--ember);flex:none}
  .tag.rec svg{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}

  .title{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:40;text-align:center;pointer-events:none;
    font-family:Anton,Impact,sans-serif;font-size:clamp(34px,9vw,86px);line-height:.95;letter-spacing:.01em;
    color:var(--paper);text-shadow:0 0 18px var(--ember),0 0 46px var(--blood),3px 3px 0 var(--blood);
    opacity:0;transition:opacity .4s .5s;animation:glitch 3s steps(1) infinite}
  body.on .title{opacity:1}
  @keyframes glitch{
    0%,92%,100%{transform:translate(0)}
    93%{transform:translate(-5px,2px);clip-path:inset(10% 0 55% 0)}
    95%{transform:translate(6px,-2px);clip-path:inset(55% 0 8% 0)}
    97%{transform:translate(-3px,0);clip-path:none}}

  @media (prefers-reduced-motion:reduce){
    .scan{display:none}
  }
</style>
</head>
<body>

<!-- flame distortion filters -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="flame" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="2" seed="3" result="n">
        <animate attributeName="baseFrequency" dur="1.4s" repeatCount="indefinite"
          values="0.012 0.05;0.02 0.085;0.012 0.05"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="flame2" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.07" numOctaves="2" seed="9" result="n">
        <animate attributeName="baseFrequency" dur="0.9s" repeatCount="indefinite"
          values="0.02 0.07;0.03 0.11;0.02 0.07"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="34" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<canvas id="embers"></canvas>
<div class="heat"></div>

<!-- fake security check gate -->
<div id="gate">
  <div class="card">
    <div class="row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
      <h1>Verifying your connection</h1>
    </div>
    <p>This site needs to confirm you are human before it continues. This only takes a moment.</p>
    <div class="check" id="check" role="checkbox" aria-checked="false" tabindex="0">
      <div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></div>
      <span>I am human</span>
    </div>
    <button class="btn" id="go" disabled>Continue</button>
  </div>
</div>

<!-- the edit -->
<div id="stage">
  <div class="center"><video id="vid" src="assets/video.mp4" autoplay loop muted playsinline webkit-playsinline preload="auto"></video></div>

  <div class="pic" data-n="1"><div class="fire"></div><img src="assets/photo1.jpg" alt=""><div class="lick"></div></div>
  <div class="pic" data-n="2"><div class="fire"></div><img src="assets/photo2.jpg" alt=""><div class="lick"></div></div>
  <div class="pic" data-n="3"><div class="fire"></div><img src="assets/photo3.jpg" alt=""><div class="lick"></div></div>
  <div class="pic" data-n="4"><div class="fire"></div><img src="assets/photo4.jpg" alt=""><div class="lick"></div></div>
</div>

<div class="hud">
  <div class="tag rec">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
  </div>
  <div class="tag">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0c0-1.6.7-2.7 1.5-3.6.2 1.2.8 1.8 1.5 2C11 7.5 11 5 12 3z"/><path d="M12 21a6.5 6.5 0 0 0 6.5-6.5c0-3-2-5-3-6"/></svg>
  </div>
</div>

<div class="vignette"></div>
<div class="scan"></div>

<!-- Put your sound at assets/sound.mp3 -->
<audio id="snd" src="assets/sound.mp3" loop preload="auto"></audio>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), vid = $('#vid'), snd = $('#snd');
  const pics = [...document.querySelectorAll('.pic')];

  /* ---- placeholder if a photo file is missing ---- */
  pics.forEach((p, i) => {
    const img = p.querySelector('img');
    img.addEventListener('error', () => {
      const hues = [18, 34, 8, 44][i];
      img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hues},90%,45%)"/><stop offset="1" stop-color="#1a0500"/></linearGradient></defs><rect width="300" height="400" fill="url(#g)"/><text x="150" y="210" fill="#fff" font-family="Impact,sans-serif" font-size="44" text-anchor="middle">PHOTO ${i+1}</text></svg>`);
    }, { once: true });
  });

  /* ---- gate ---- */
  const check = $('#check'), go = $('#go');
  const toggle = () => {
    const on = check.classList.toggle('on');
    check.setAttribute('aria-checked', on);
    go.disabled = !on;
  };
  check.addEventListener('click', toggle);
  check.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } });
  go.addEventListener('click', start);

  function start() {
    $('#gate').classList.add('gone');
    document.body.classList.add('on');
    stage.classList.add('live', 'hit');
    vid.muted = true;
    vid.play().catch(()=>{});
    snd.currentTime = 0;
    snd.volume = 1;
    snd.play().catch(()=>{});
    layout();
    pics.forEach(initPic);
    last = performance.now();
    requestAnimationFrame(tick);
  }

  /* ---- video can never stop ---- */
  ['pause', 'ended', 'stalled', 'suspend'].forEach(ev =>
    vid.addEventListener(ev, () => { if (stage.classList.contains('live')) vid.play().catch(()=>{}); }));
  setInterval(() => { if (stage.classList.contains('live') && vid.paused) vid.play().catch(()=>{}); }, 400);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && stage.classList.contains('live')) { vid.play().catch(()=>{}); snd.play().catch(()=>{}); }
  });
  document.addEventListener('contextmenu', e => e.preventDefault());

  /* ---- bouncing, direction-changing, pulsing photos ---- */
  let W = innerWidth, H = innerHeight, base = 180;
  function layout() {
    W = innerWidth; H = innerHeight;
    base = Math.max(110, Math.min(W * 0.26, 230));
    pics.forEach(p => p.style.setProperty('--s', base + 'px'));
  }
  addEventListener('resize', layout);

  const rand = (a, b) => a + Math.random() * (b - a);
  const st = new Map();

  function initPic(p) {
    const w = base, h = base * 4 / 3;
    const a = rand(0, Math.PI * 2), sp = rand(140, 340);
    st.set(p, {
      x: rand(0, Math.max(1, W - w)), y: rand(0, Math.max(1, H - h)),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      turnIn: rand(.4, 1.6),
      scale: 1, scaleFrom: 1, scaleTo: 1, sT: 1, sDur: 1,
      sIn: rand(.5, 2),
      rot: rand(-12, 12), rotV: rand(-40, 40)
    });
  }

  function newDirection(s) {
    const a = rand(0, Math.PI * 2), sp = rand(140, 380);
    s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp;
    s.turnIn = rand(.35, 1.8);
    s.rotV = rand(-70, 70);
  }

  let last = 0;
  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    pics.forEach(p => {
      const s = st.get(p);

      s.turnIn -= dt;
      if (s.turnIn <= 0) newDirection(s);

      s.sIn -= dt;
      if (s.sIn <= 0) {                       // pick a new random size
        s.scaleFrom = s.scale;
        s.scaleTo = Math.random() < .5 ? rand(1.8, 2.7) : rand(.8, 1.2);
        s.sT = 0; s.sDur = rand(.35, .9);
        s.sIn = rand(.9, 2.6);
      }
      if (s.sT < 1) {
        s.sT = Math.min(1, s.sT + dt / s.sDur);
        const e = 1 - Math.pow(1 - s.sT, 3);
        s.scale = s.scaleFrom + (s.scaleTo - s.scaleFrom) * e;
      }

      const w = base * s.scale, h = w * 4 / 3;
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.rot += s.rotV * dt;

      if (s.x < 0) { s.x = 0; s.vx = Math.abs(s.vx); }
      if (s.y < 0) { s.y = 0; s.vy = Math.abs(s.vy); }
      if (s.x + w > W) { s.x = Math.max(0, W - w); s.vx = -Math.abs(s.vx); }
      if (s.y + h > H) { s.y = Math.max(0, H - h); s.vy = -Math.abs(s.vy); }

      // transform scales from the top-left, so position uses the unscaled box
      p.style.transform =
        `translate(${s.x}px,${s.y}px) scale(${s.scale}) rotate(${s.rot}deg)`;
      p.style.transformOrigin = '0 0';
    });
    requestAnimationFrame(tick);
  }

  /* ---- embers ---- */
  const cv = $('#embers'), cx = cv.getContext('2d');
  let parts = [];
  function sizeCv() { cv.width = innerWidth; cv.height = innerHeight; }
  sizeCv(); addEventListener('resize', sizeCv);
  function spawn() {
    parts.push({ x: rand(0, cv.width), y: cv.height + 10, r: rand(1, 3.4),
      vy: rand(60, 200), vx: rand(-30, 30), life: 0, max: rand(2, 5), ph: rand(0, 6.28) });
  }
  let lt = performance.now();
  (function loop(t) {
    const dt = Math.min(.05, (t - lt) / 1000); lt = t;
    cx.clearRect(0, 0, cv.width, cv.height);
    if (parts.length < 140) for (let i = 0; i < 2; i++) spawn();
    parts = parts.filter(p => p.life < p.max);
    parts.forEach(p => {
      p.life += dt; p.y -= p.vy * dt; p.x += (p.vx + Math.sin(p.life * 4 + p.ph) * 26) * dt;
      const k = 1 - p.life / p.max;
      cx.beginPath();
      cx.fillStyle = `rgba(255,${Math.floor(90 + 120 * k)},20,${k})`;
      cx.shadowColor = '#ff6a00'; cx.shadowBlur = 10;
      cx.arc(p.x, p.y, p.r * (.5 + k), 0, 6.28);
      cx.fill();
    });
    requestAnimationFrame(loop);
  })(lt);
})();
</script>
</body>
</html>
